[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
asyncio_mode = strict
markers =
    unit: fast, no I/O
    integration: exercises multiple collaborating components
    external_contract: verifies request/response shape of a mocked external API
    database: exercises the SQLAlchemy/SQLite test database
    slow: long-running test, excluded from the default fast run
